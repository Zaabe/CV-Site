server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compressione gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # Security headers di base
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache lunga per immagini e font. Senza "immutable": quella parola vieta al
    # browser di ricontrollare il file anche su un ricaricamento esplicito, e va
    # bene solo per nomi che cambiano a ogni versione. NB: add_header in un
    # location sostituisce quelli del server, quindi i security headers vanno
    # ripetuti.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # CSS e JS condivisi: nessuna cache a tempo, si rivalidano con ETag a ogni
    # caricamento (risposte 304, costo trascurabile). Con una cache a tempo una
    # modifica di stile può restare invisibile per tutta la sua durata anche
    # dopo il deploy. I location regex hanno la precedenza su quelli prefisso,
    # quindi questo vince su /assets/.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # PDF: il curriculum si aggiorna tenendo lo stesso nome di file. Con la
    # cache a 30 giorni di /assets/ chi aveva gia' visitato il sito continuava a
    # scaricare quello vecchio; cosi' il browser chiede ogni volta se e' cambiato
    # e, se non lo e', riceve un 304 senza riscaricarlo.
    location ~* \.pdf$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # .ipynb: dichiarato JSON per farlo gzippare. Va fatto qui e non con un
    # blocco "types", perche' quello sostituirebbe l'intera mappa mime di nginx
    # e css/js/html finirebbero come application/octet-stream.
    location ~* \.ipynb$ {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Pagine: $uri.html permette URL senza estensione (/projects -> projects.html).
    # Un indirizzo inesistente risponde 404: prima ricadeva su /index.html e
    # restituiva la home con stato 200, anche per /favicon.ico, cosi' browser e
    # motori di ricerca ricevevano una pagina "valida" a qualunque URL.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Chi chiede il vecchio percorso dell'icona riceve quella vettoriale.
    location = /favicon.ico {
        try_files /favicon.svg =404;
    }

    # Nessuna cache sull'HTML, così gli aggiornamenti sono immediati
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
