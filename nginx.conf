server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compressione gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # Security headers di base
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache lunga per immagini, PDF e font. NB: add_header in un location
    # sostituisce quelli del server, quindi i security headers vanno ripetuti.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # CSS e JS condivisi: nessuna cache a tempo, si rivalidano con ETag a ogni
    # caricamento (risposte 304, costo trascurabile). Con una cache a tempo una
    # modifica di stile può restare invisibile per tutta la sua durata anche
    # dopo il deploy. I location regex hanno la precedenza su quelli prefisso,
    # quindi questo vince su /assets/.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # .ipynb: dichiarato JSON per farlo gzippare. Va fatto qui e non con un
    # blocco "types", perche' quello sostituirebbe l'intera mappa mime di nginx
    # e css/js/html finirebbero come application/octet-stream.
    location ~* \.ipynb$ {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Pagine: $uri.html permette URL senza estensione (/projects -> projects.html)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Nessuna cache sull'HTML, così gli aggiornamenti sono immediati
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
