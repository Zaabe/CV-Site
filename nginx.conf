server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compressione gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # Security headers di base
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache lunga per gli asset statici (immagini, font, ecc.)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Pagina principale (curriculum)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nessuna cache sull'HTML, così gli aggiornamenti sono immediati
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
