<script>
/* Tema scelto prima del primo disegno, per non far lampeggiare quello
   sbagliato: quello salvato, altrimenti la preferenza di sistema. La classe
   js dice al CSS che le animazioni di comparsa avranno chi le fa partire. */
(function () {
  var d = document.documentElement, t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  d.setAttribute('data-theme', t);
  d.classList.add('js');
})();
</script>
